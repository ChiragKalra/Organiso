apply plugin: 'com.android.application'

apply plugin: 'com.android.legacy-kapt'

// Local debug overrides are opt-in; ordinary builds retain the production identity.
def debugApplicationIdSuffix = providers.gradleProperty('debugApplicationIdSuffix').orElse('')
def debugVersionNameSuffix = providers.gradleProperty('debugVersionNameSuffix').orElse('')
def debugAppLabel = providers.gradleProperty('debugAppLabel')

android {
    namespace 'com.bruhascended.organiso'
    compileSdk 37

    buildFeatures {
        buildConfig true
    }

    aaptOptions {
        noCompress "html"
    }

    // AGP 9 rejects android:extractNativeLibs="true" in the manifest; this is the equivalent setting.
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId "com.bruhascended.organiso"
        minSdk 26
        targetSdk 36
        versionCode 1013
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLabel: '@string/app_name']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        debug {
            if (debugApplicationIdSuffix.get()) applicationIdSuffix debugApplicationIdSuffix.get()
            if (debugVersionNameSuffix.get()) versionNameSuffix debugVersionNameSuffix.get()
            if (debugAppLabel.isPresent()) manifestPlaceholders = [appLabel: debugAppLabel.get()]
            minifyEnabled false
            debuggable true

            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a', "x86_64"
            }
        }
    }

    compileOptions {
        sourceCompatibility "1.8"
        targetCompatibility "1.8"
    }
}

// Built-in Kotlin (AGP 9): jvmTarget defaults to compileOptions.targetCompatibility.
kotlin {
    compilerOptions {
        freeCompilerArgs.add('-XXLanguage:+UnitConversion')
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation "androidx.viewpager2:viewpager2:1.0.0"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.3.0"
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'androidx.fragment:fragment-ktx:1.3.0'
    implementation 'androidx.work:work-runtime:2.9.0'

    implementation 'commons-io:commons-io:2.6'

    implementation 'com.google.android.material:material:1.3.0'

    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'
    implementation 'com.squareup.picasso:picasso:2.71828'


    implementation 'com.google.firebase:firebase-core:18.0.2'
    implementation 'com.google.firebase:firebase-analytics:18.0.2'
    implementation 'com.google.firebase:firebase-perf:19.1.1'
    implementation 'com.google.firebase:firebase-database:19.6.0'
    implementation 'com.google.firebase:firebase-storage:19.2.1'


    implementation project(':core')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
