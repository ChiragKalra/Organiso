plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
    id 'kotlin-kapt'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.bruhascended.core'
    compileSdk 34



    aaptOptions {
        noCompress "tflite", "csv"
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    api 'androidx.preference:preference-ktx:1.2.1'
    api "androidx.paging:paging-runtime-ktx:3.2.1"
    api 'androidx.room:room-runtime:2.6.1'
    api "androidx.room:room-ktx:2.6.1"
    api "androidx.room:room-paging:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    api 'com.klinkerapps:android-smsmms:5.2.5'

    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'

    implementation 'io.michaelrocks:libphonenumber-android:8.13.0'

    implementation 'com.google.code.gson:gson:2.8.6'
}