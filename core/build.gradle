plugins {
    id 'com.android.library'
    id 'com.android.legacy-kapt'
}

// AGP 9 removed the old variant API used by google-services 4.3.x, and google-services 4.4+
// only supports application modules (the app's ".staging" debug id has no client in
// app/google-services.json). Generate the same Firebase string resources that google-services
// 4.3.15 produced for this library from google-services.json (client com.bruhascended.core).
def googleServicesJson = new groovy.json.JsonSlurper().parse(file('google-services.json'))
def googleServicesClient = googleServicesJson.client.find {
    it.client_info.android_client_info.package_name == 'com.bruhascended.core'
}

android {
    namespace 'com.bruhascended.core'
    compileSdk 37

    buildFeatures {
        buildConfig true // Constants.kt uses BuildConfig.LIBRARY_PACKAGE_NAME
        resValues true
    }


    aaptOptions {
        noCompress "tflite", "csv"
    }

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        consumerProguardFiles "consumer-rules.pro"

        def projectInfo = googleServicesJson.project_info
        resValue "string", "gcm_defaultSenderId", projectInfo.project_number
        resValue "string", "project_id", projectInfo.project_id
        resValue "string", "firebase_database_url", projectInfo.firebase_url
        resValue "string", "google_storage_bucket", projectInfo.storage_bucket
        resValue "string", "google_app_id", googleServicesClient.client_info.mobilesdk_app_id
        resValue "string", "google_api_key", googleServicesClient.api_key[0].current_key
        resValue "string", "google_crash_reporting_api_key", googleServicesClient.api_key[0].current_key
        resValue "string", "default_web_client_id",
                googleServicesClient.oauth_client.find { it.client_type == 3 }.client_id
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Built-in Kotlin (AGP 9): jvmTarget defaults to compileOptions.targetCompatibility (1.8).
}

dependencies {
    api "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    api 'androidx.preference:preference-ktx:1.2.1'
    api "androidx.paging:paging-runtime-ktx:3.2.1"
    // Room 2.6.1's processor can't read Kotlin 2.4 metadata; 2.7.2 is the first release that uses
    // the (overridable) kotlin-metadata-jvm artifact, lifted to the Kotlin version below.
    api 'androidx.room:room-runtime:2.7.2'
    api "androidx.room:room-ktx:2.7.2"
    api "androidx.room:room-paging:2.7.2"
    kapt "androidx.room:room-compiler:2.7.2"
    kapt "org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlin_version"

    api 'com.klinkerapps:android-smsmms:5.2.5'

    implementation 'com.google.ai.edge.litert:litert:1.4.1'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.1'

    implementation 'io.michaelrocks:libphonenumber-android:8.13.0'

    implementation 'com.google.code.gson:gson:2.8.6'
}