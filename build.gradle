buildscript {
    ext.kotlin_version = "2.4.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        // Provides com.android.legacy-kapt (kapt replacement under AGP 9 built-in Kotlin)
        classpath 'com.android.tools.build:gradle-kotlin:9.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
